name: reproduce
on: [push, pull_request]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python tools/verify_seal.py
      - run: python tools/reproduce.py
      - run: python tools/verify_seal.py   # the seal must still be intact after reproduction
